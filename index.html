<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SynthIQ" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SynthIQ</title>
    <script>
      // Restore the last applied theme before first paint (no flash while
      // the app bundle loads). The app re-applies the real theme on start.
      (function () {
        var root = document.documentElement;
        try {
          var cache = JSON.parse(localStorage.getItem("synthiq.themeCache"));
          if (cache && cache.vars) {
            root.setAttribute("data-bs-theme", cache.theme);
            for (var name in cache.vars)
              root.style.setProperty(name, cache.vars[name]);
            root.style.backgroundColor = cache.vars["--app-bg"];
            return;
          }
        } catch (e) {}
        var dark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        root.setAttribute("data-bs-theme", dark ? "dark" : "light");
        root.style.backgroundColor = dark ? "#0f1417" : "#f7f9ff";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
